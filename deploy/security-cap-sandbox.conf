# CAP instrumentation checks eval/Function. Permit them only in this opaque-origin
# sandbox, never in the parent official/auth application policy.
add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'self'; sandbox allow-scripts; script-src 'self' 'nonce-$request_id' 'unsafe-eval'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
