include snippets/security-common.conf;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'nonce-$request_id' https://fonts.googleapis.com; worker-src 'self' blob:; frame-src 'self'; img-src 'self' data: https://api.lastudio.cc; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.lastudio.cc https://auth.lastudio.cc; form-action 'self'" always;
