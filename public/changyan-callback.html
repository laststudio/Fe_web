<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="LastStudio Fe Web 畅言登录认证回调页面，仅供内部同源会话通信使用。" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Fe Web 畅言登录认证回调页面</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #475569;
      font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
  </style>
</head>
<body>
  <h1 class="sr-only">Fe Web 畅言登录回调</h1>
  <p>登录完成，正在返回…</p>
  <script>
    // 畅言登录成功后会把浏览器 302 到本页，并在查询串带上 CAS 票据（st / service）。
    // 本页与主应用同源，父页面可直接读取 location；这里再补一次 postMessage 便于排查。
    (function () {
      var payload = { type: 'changyan-callback', search: window.location.search, href: window.location.href };
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, window.location.origin);
        }
      } catch (err) {
        // 父页面跨域时忽略
      }
    })();
  </script>
</body>
</html>
